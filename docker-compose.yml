services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: propolis
      POSTGRES_PASSWORD: wikipassword
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propolis -d wiki"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    ports:
      - "8000:5000"
    environment:
      DB_HOSTNAME: db
      DATABASE: wiki
      DB_USERNAME: propolis
      DB_PASSWORD: wikipassword
      SESSION_REDIS: redis://redis:6379
    volumes:
      - ./instance:/app/instance:ro
      - ./wiki:/app/wiki
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
